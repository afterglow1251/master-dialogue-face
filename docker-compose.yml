services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-facial_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-facial_pass}
      - POSTGRES_DB=${DB_NAME:-facial_expressions}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-facial_user} -d ${DB_NAME:-facial_expressions}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MODEL_NAME=${MODEL_NAME:-SamLowe/roberta-base-go_emotions}
      - DEVICE=${DEVICE:-cpu}
      - NLP_PORT=8000
    ports:
      - "${NLP_PORT:-8000}:8000"
    volumes:
      - model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    # GPU support: uncomment below
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NLP_SERVICE_URL=http://nlp-service:8000
      - PORT=3000
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - NLP_ANALYZE_TIMEOUT_MS=${NLP_ANALYZE_TIMEOUT_MS:-30000}
      - NLP_HEALTH_TIMEOUT_MS=${NLP_HEALTH_TIMEOUT_MS:-5000}
      - WS_DEFAULT_CONTEXT_WINDOW_SIZE=${WS_DEFAULT_CONTEXT_WINDOW_SIZE:-3}
      - WS_DEFAULT_EXPRESSION_INTENSITY=${WS_DEFAULT_EXPRESSION_INTENSITY:-1.0}
      - WS_MAX_CONTEXT_WINDOW_SIZE=${WS_MAX_CONTEXT_WINDOW_SIZE:-10}
      - WS_MAX_EXPRESSION_INTENSITY=${WS_MAX_EXPRESSION_INTENSITY:-2.0}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      nlp-service:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:3000}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:3000/ws}
        - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  model_cache:
  pgdata:

services:
  - type: web
    name: backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: NLP_SERVICE_URL
        sync: false
      - key: NLP_ANALYZE_TIMEOUT_MS
        value: "30000"
      - key: NLP_HEALTH_TIMEOUT_MS
        value: "5000"

  - type: web
    name: frontend
    runtime: static
    buildCommand: cd frontend && bun install --frozen-lockfile && bun run build-only
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_WS_URL
        sync: false

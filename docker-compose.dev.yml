services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-facial_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-facial_pass}
      - POSTGRES_DB=${DB_NAME:-facial_expressions}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-facial_user} -d ${DB_NAME:-facial_expressions}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-facial_user}:${DB_PASSWORD:-facial_pass}@postgres:5432/${DB_NAME:-facial_expressions}
      - PORT=3000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend/src:/app/src
      - ./shared:/shared
    command: sh -c "bun run db:migrate && bun run db:seed && bun run --watch src/index.ts"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    restart: unless-stopped
    env_file: ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./shared:/shared
    depends_on:
      - backend

volumes:
  pgdata:
